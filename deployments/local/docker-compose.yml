name: sap-cpi-toolkit-v2

services:
  portal:
    build:
      context: ../../
      dockerfile: Dockerfile.portal
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORTAL_PORT:-3000}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-true}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      IAS_CLIENT_ID: ${IAS_CLIENT_ID:-}
      IAS_CLIENT_SECRET: ${IAS_CLIENT_SECRET:-}
      IAS_TENANT_URL: ${IAS_TENANT_URL:-}
    depends_on:
      - api
    mem_limit: 128m
    restart: unless-stopped

  api:
    build:
      context: ../../
      dockerfile: Dockerfile.api
    expose:
      - "8080"
    environment:
      PORT: ${API_PORT:-8080}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      DB_URL: ${DB_URL:-postgres://toolkit:toolkit@postgres:5432/toolkit?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toolkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toolkit}
      POSTGRES_DB: ${POSTGRES_DB:-toolkit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolkit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
