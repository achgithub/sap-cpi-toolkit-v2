name: sap-cpi-toolkit-v2

services:
  portal:
    build:
      context: ../../
      dockerfile: Dockerfile.portal
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORTAL_PORT:-3000}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-true}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      GROOVY_INTERNAL_URL: ${GROOVY_INTERNAL_URL:-http://groovy-runner:8082}
      IAS_CLIENT_ID: ${IAS_CLIENT_ID:-}
      IAS_CLIENT_SECRET: ${IAS_CLIENT_SECRET:-}
      IAS_TENANT_URL: ${IAS_TENANT_URL:-}
    depends_on:
      - api
    mem_limit: 128m
    restart: unless-stopped

  api:
    build:
      context: ../../
      dockerfile: Dockerfile.api
    expose:
      - "8080"
    ports:
      - "8444:8444"
    environment:
      PORT: ${API_PORT:-8080}
      MOCK_TLS_PORT: ${MOCK_TLS_PORT:-8444}
      CC_INTERNAL_URL: ${CC_INTERNAL_URL:-https://host.docker.internal:8443}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      DB_URL: ${DB_URL:-postgres://toolkit:toolkit@postgres:5432/toolkit?sslmode=disable}
      SFTP_DATA_DIR: /data/sftp
    volumes:
      - sftp-data:/data/sftp
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  groovy-runner:
    build:
      context: ../../groovy-runner
      dockerfile: Dockerfile
    expose:
      - "8082"
    environment:
      PORT: ${GROOVY_PORT:-8082}
    mem_limit: 512m
    restart: unless-stopped

  sftp-server:
    build:
      context: ../../sftp-server
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    environment:
      CONTROL_PLANE_URL: ${SFTP_CONTROL_PLANE_URL:-http://api:8080}
      SFTP_ROOT_DIR: /data/sftp
      HOST_KEY_PATH: /data/host_key
    volumes:
      - sftp-data:/data/sftp
      - sftp-keys:/data
    depends_on:
      - api
    mem_limit: 64m
    restart: unless-stopped

  sap-cloudconnector:
    image: sap-cloudconnector:2.19.0
    profiles:
      - scc
    ports:
      - "8443:8443"
    mem_limit: 512m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toolkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toolkit}
      POSTGRES_DB: ${POSTGRES_DB:-toolkit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolkit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  sftp-data:
  sftp-keys:
